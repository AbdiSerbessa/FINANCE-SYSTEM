version: '3.8'

services:
  # 1. New Dedicated PostgreSQL Database
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: finance123
      POSTGRES_DB: factory_finance
    ports:
      - "5433:5432"  # Maps internal 5432 to host port 5433 so it doesn't conflict with any old DBs
    volumes:
      - finance_db_data:/var/lib/postgresql/data

  # 2. PHP Service
  app:
    build: .
    volumes:
    - .:/var/www/html
    depends_on:
      - db           # Waits for the database to be ready

  # 3. Nginx Web Server
  # 4. Web-Based Database Administrator Engine
  # 4. Web-Based Database Administrator Engine
  adminer:
    image: adminer:latest
    restart: always
    ports:
      - "8083:8080"
  web:
    image: nginx:latest
    ports:
      - "8082:80"
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  finance_db_data:   # Persists your data so it isn't lost when containers stop